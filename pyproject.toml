[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ziniao-automation"
version = "0.1.0"
description = "Loopback-only multi-store Ziniao automation manager"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "apscheduler>=3.10,<4",
  "httpx>=0.27,<1",
  "playwright>=1.48,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
ziniao-automation = "ziniao_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ziniao_automation*"]

[tool.setuptools.package-data]
ziniao_automation = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
