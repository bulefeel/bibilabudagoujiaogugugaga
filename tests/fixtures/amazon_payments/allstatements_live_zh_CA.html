<!doctype html>
<!--

  The older statements_zh_CA.html fixture used a hand-invented
  ".disbursement-card" wrapper, so the row selector was only ever validated
  against a fixture written to match it.  On the real page that class does not
  exist at all and the matcher found zero candidates — every disbursement was
  reported NOT_FOUND even while its amount was plainly rendered.

-->
